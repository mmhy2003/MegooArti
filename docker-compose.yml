# A complete installation: the database, the backend, the web UI and a gateway.
# What an installation must choose is in .env (copy .env.example): without the
# database's password nothing starts.
name: megooarti

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: megooarti
      POSTGRES_PASSWORD: ${MEGOOARTI_DB_PASSWORD:?Set MEGOOARTI_DB_PASSWORD. Copy .env.example to .env and choose one}
      POSTGRES_DB: megooarti
    ports:
      # Loopback only: the database is published for development tools, not for the network.
      - "127.0.0.1:${MEGOOARTI_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U megooarti -d megooarti"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The API, the repositories and the registry. It is reached through the gateway only.
  backend:
    # `docker compose build` makes the image under the name a registry would hold it by.
    image: megooarti/backend:${MEGOOARTI_VERSION:-0.1.0}
    # Built here, and never fetched: on a public registry the name is whoever's took it.
    pull_policy: build
    build:
      context: ./backend
      args:
        VERSION: ${MEGOOARTI_VERSION:-0.1.0}
    environment:
      MEGOOARTI_DATABASE_URL: postgresql://megooarti@db:5432/megooarti
      # Apart from the address, so that it may hold any character.
      MEGOOARTI_DATABASE_PASSWORD: ${MEGOOARTI_DB_PASSWORD:?Set MEGOOARTI_DB_PASSWORD. Copy .env.example to .env and choose one}
      # Passed on if it is set. Without it the backend makes a key in its data directory.
      MEGOOARTI_SECRET_KEY:
      # This container is not published: requests from outside come through the
      # gateway, which says who is calling and overwrites what a client says of itself.
      MEGOOARTI_FORWARDED_ALLOW_IPS: "*"
      MEGOOARTI_SESSION_COOKIE_SECURE: ${MEGOOARTI_SESSION_COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy
    # Must stay longer than MEGOOARTI_SHUTDOWN_GRACE_SECONDS (default 30), or Docker
    # kills the container while requests are still finishing.
    stop_grace_period: 40s
    volumes:
      - backend-data:/var/lib/megooarti
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/status/ready', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # The web UI. It holds no data and no secret, and never calls the backend: the
  # browser does.
  frontend:
    image: megooarti/frontend:${MEGOOARTI_VERSION:-0.1.0}
    pull_policy: build
    build:
      context: ./frontend
      args:
        VERSION: ${MEGOOARTI_VERSION:-0.1.0}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # The one published address. For development and testing: in production your own
  # reverse proxy takes its place, with the rules of gateway/nginx.conf.
  gateway:
    image: nginx:stable-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${MEGOOARTI_HTTP_PORT:-8000}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  db-data:
  backend-data:
